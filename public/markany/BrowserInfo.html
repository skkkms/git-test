	var supportingRangeArr = {
		"Windows NT" : [ "Chrome", "MSIE", "Edge", "Firefox", "Opera" ],
		"Linux" : [ "Chrome", "Firefox", "Opera" ],
		"Mac OS X" : [ "Chrome", "Firefox", "Opera", "Safari" ]
	};
	
	
	function maWebDrmApplyCheck(osName, bsName) {
		var maWebDrmSupportFlag = false;
		var errCode = 0;
		
		//osName = "nonOS"
		var supportBsArr = supportingRangeArr[osName];
		if( supportBsArr != null ){
			
			for(var bs_i=0; bs_i<supportBsArr.length; bs_i++){
				if( supportBsArr[bs_i] === bsName ){
					maWebDrmSupportFlag = true;
					break;
				}
				
				if( maWebDrmSupportFlag === false && bs_i == (supportBsArr.length - 1) ){
					MDBG(bsName + "은(는) 지원 불가능한 브라우져입니다.", "");
					errCode = 1001;
				}
			}
		}else{
			MDBG(osName + "은(는) 지원 불가능한 플렛폼입니다.", "");
			errCode = 1002;
		}
		return maWebDrmSupportFlag;
	}
	
	maWebDrmApplyCheck(userInfo.osName, userInfo.bsName);

	document.writeln("bsName : " + userInfo.bsName + "<br>");
	document.writeln("bsVersion : " + userInfo.bsVersion + "<br>");
	document.writeln("bsBit : " + userInfo.bsBit);
</script>
