	<script>

	{

	//##################다운로드 URL설정 변수입니다.##################
	webDrmUrl 	= "./bin/Inst_MaWebDRM.exe";
	/*******************************************************************************
	 * 	function	downloadFile 	-	파일 다운로드
	 *
	 * 	@Parameter	downloadType	-	OS종류

	function downloadFile(downloadType) {
		location.href = webDrmUrl;
	}
		
	//var installCheckFunHandle = setInterval("MaWebDRMInstllChk('installCheckFun')", 1000);
	//$("#webDrmInstalled").hide();
	//$("#btn_Download_webDrm").hide();
	
	/*******************************************************************************
	 * 	function	resize_window()	-	넘어온 페이지에서 수동설치 페이지의 크기에 맞게 리사이징
	 *									IE 버그로 현재 창의 IE를 구해 변경이 안됬을 경우 0.2초 후 다시 재귀호출
	 ******************************************************************************/
	var bResizeFlag = false;
	function resize_window() {			
		if( document.body.clientWidth < 800){
			try{
				window.resizeTo(850, 800);
			}catch(e){
			}
		}else{
			bResizeFlag = true;
		}
		if( bResizeFlag != true ){
			setTimeout(function(){
				resize_window();
			},200);
		}
	}
	//resize_window();	
	</script>
