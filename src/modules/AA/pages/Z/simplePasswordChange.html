        // 메시지ID 에 해당하는 메시지 값 가져오기
        function getMessageById(messageId) {
            var msgObj = messageList.find(arg => {
                return arg.messageId == messageId;
            });

            if(msgObj){
                return msgObj.messageText;
            } else {
                return messageId;
            }
        }

        function makeData() {
            return JSON.stringify(
                {
                    'tenantId': $("#tenantId").val(),
                    'portalId': $("#portalId").val(),
                    'loginId': $("#loginId").val(),
                    'password': $("#password").val(),
                    'otpNumber': $("#otpNumber").val(),
                    'languageId': navigator.language.substr(0,2)
                }
            );
        }
        function login() {
            var loginId = $("#loginId").val();
            var otpNumber = $("#otpNumber").val();
            var otpType = "NONE";
            if (loginId && loginId != '') {
                $.ajax({
                    url: '/certification/iaa-simple-login',
                    type: 'POST',
                    data: makeData(),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    success: function (data) {
                        // $("#otpUserEmail").text(data.userEmail);
                        if (data.errorMessage) {
                            alert(data.errorMessage);
                            $("#otpNumber").val('');
                        } else {
                            if (otpType != 'NONE') {
                                if (otpNumber == '') {
                                    alert(getMessageById('MSG_ALT_INP_OTP'));
                                    $("#otpNumber").focus();
                                    return;
                                }
                            }

                            if (data.token) {
                                localStorage.setItem("accessToken", data.token);
                            }

                            if (data.password) {
                                alert(data.password);
                                window.location.assign('#popup1');
                            }
                            if (data.redirectUrl) {
                                document.location.replace(data.redirectUrl);
                            }
                        }
                    }
                });
            } else {
                // "ID 를 입력하세요."
                alert(getMessageById('MSG_ALT_INP_USR_ID'));
                $("#loginId").focus();
            }
        }
        function passwordChange() {
            var userName = $("#userName").val();
            var userEmail = $("#userEmail").val();

            if (userName && userName == '') {
                // "사용자명을 입력하세요."
                alert(getMessageById('MSG_ALT_INP_USR_NAME'));
                $("#userName").focus();
            } else if (userEmail && userEmail == '') {
                // "email을 입력하세요."
                alert(getMessageById('MSG_ALT_INP_EMAIL'));

                $("#userEmail").focus();
            } else {
                $.ajax({
                    url: '/certification/search-user-password',
                    type: 'POST',
                    data: JSON.stringify(
                        {'tenantId': $("#tenantId").val(), 'portalId': $("#portalId").val(), 'userName': $("#userName").val(), 'userEmail': userEmail}
                    ),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    success: function (data) {
                        if (data.errorMessage) {
                            alert(data.errorMessage);
                        } else {
                            // "등록된 이메일로 임시 비밀번호가 전송되었습니다."
                            alert(getMessageById('MSG_ALT_TEMP_PWD_REG_EMAIL'));
                            hidePopup2();
                        }
                    }
                });
            }
        }

        function $ComTimer(){
            //prototype extend
        }

        $ComTimer.prototype = {
            comSecond : ""
            , fnCallback : function(){}
            , timer : ""
            , domId : ""
            , fnTimer : function(){
                var m = Math.floor(this.comSecond / 60) + ":" + (this.comSecond % 60);	// 남은 시간 계산
                this.comSecond--;					// 1초씩 감소
                // console.log(m);
                this.domId.innerText = m;
                if (this.comSecond < 0) {
                    clearInterval(this.timer);
                    // "인증시간이 초과하였습니다. 다시 인증해주시기 바랍니다."
                    alert(getMessageById('MSG_ALT_AUTH_TIMEOUT'));
                    // $("#otpNumber").attr('disabled', 'true');
                    $("#otpInBtn").removeClass('disabled');
                    $("#otpNumber").val('');
                    this.domId.innerText = '';
                }
            }
            ,fnStop : function(){
                clearInterval(this.timer);
            }
        }

        /**
         * 메인 문자열 내 {index} 에 해당하는 파라미터 문자열로 대치하여 리턴
         * @param str : 메인 문자열
         * @param ...str : 메인 문자열에 삽입할 문자들
         * @returns {*} : 조합된 문자열
         */
        function strFormat(str) {
            let theString = str;
            let args = arguments.length;
            for (let i = 0; i < args; i++) {
                let regExp = new RegExp('\\{' + i + '\\}', 'gm');
                if(arguments[i+1] !== undefined)
                    theString = theString.replace(regExp, arguments[i+1]);
            }
            return theString;
        }
